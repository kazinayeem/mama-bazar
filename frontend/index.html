<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brandlogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mama Bazar" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <title>Mama Bazar - Premium Products &amp; Gadgets</title>
    <meta name="description" content="Discover premium products at unbeatable prices. Official warranty, free delivery, and 24/7 support." />

    <!-- Preload self-hosted Inter 400 so the browser fetches it as early as possible
         (before CSS is parsed). Only preload the primary weight; others load on demand. -->
    <link rel="preload" href="/fonts/inter-400-normal.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Preconnect to Cloudinary's CDN. Every homepage image (hero, product cards,
         categories, brands, collections) is served from res.cloudinary.com. In this SPA
         the image URLs are only discovered AFTER the /api/homepage response returns and
         React renders, so the browser cannot resolve them at HTML-parse time. Warming the
         DNS+TCP+TLS connection now means the LCP hero image starts downloading the instant
         its URL is discovered, with no connection round-trip (saves ~100-300ms on mobile). -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Google Analytics (async — does not block rendering) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JF4ZV7421X"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-JF4ZV7421X');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
